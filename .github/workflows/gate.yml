name: gate
# Gate A on every pull request: the app against every captured oracle state. Fails when a
# pass count goes below parity/gate-a.json, or a captured state has no recorded run.
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gate-a:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: node scripts/gate.mjs --ci
      # Behaviour: rename, the unread dot, the Working label, each rule against a control. A red.
      - run: node scripts/behaviour.mjs
      # Gate B, report only: each recorded oracle turn replayed in ours. Its timings are judged on
      # the Mac the oracle was recorded on (land.sh runs it for real); this runner is slower and
      # misses feel budgets the app meets there. A drop here is a warning on the PR, never a red.
      # Not continue-on-error: that shows a failed step as a green run.
      - name: Gate B (report only)
        run: |
          set +e
          node scripts/gate-b.mjs --ci --show 20 > gate-b.log 2>&1
          rc=$?
          cat gate-b.log
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=Gate B (report only)::$(grep -E '^Gate B( ·|:)' gate-b.log | tr '\n' ' ')"
          fi
          exit 0
