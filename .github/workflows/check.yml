name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      # Types: a generator that writes a key the app's types do not have (a SceneRow with rowGap)
      # passes npm run check and Gate A, and only tsc says so (TS2353; #302 review). A red.
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm exec tsc --noEmit -p .
        working-directory: app
