<circle cx="1140" cy="62" r="19" fill="none" stroke="#2d2d31"/><path d="M1133 55L1147 69M1147 55L1133 69" stroke="#b5b5ba" stroke-width="2" stroke-linecap="round"/>
<use href="#mk" transform="translate(978 96) scale(2)"/>
