<rect x="767" y="574" width="10" height="16" rx="5" fill="none" stroke="#9a9aa0" stroke-width="1.8"/><path d="M763 585C763 592 781 592 781 585M772 592V597" fill="none" stroke="#9a9aa0" stroke-width="1.8" stroke-linecap="round"/>
