<rect x="948" y="222" width="82" height="32" rx="16" fill="#26262a"/>
<text x="989" y="243" font-size="14" text-anchor="middle" class="ink">Activity</text>
<text x="1066" y="243" font-size="14" text-anchor="middle" class="dim">Library</text>
<g class="tag" transform="translate(1112 228)"><rect width="44" height="20" rx="10"/><text x="22" y="14" text-anchor="middle">J03</text></g>

<text x="882" y="292" font-size="13" class="dim">Coding</text>
