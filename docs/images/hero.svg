<rect x="510" y="138" width="334" height="42" rx="21" class="mine"/>
<text x="530" y="164" font-size="15" class="ink">How much storage do you have, and where?</text>
<rect x="128" y="196" width="290" height="42" rx="21" class="bubble"/>
<text x="148" y="222" font-size="15" class="ink">I'll check the disk on my computer.</text>
<rect x="128" y="246" width="430" height="62" rx="20" class="bubble"/>
<text x="148" y="272" font-size="15" class="ink">38 GB free of 75 GB, on barkbot-01 in Nuremberg.</text>
<text x="148" y="294" font-size="15" class="ink">Here are the screenshots I saved today:</text>
<use href="#thumb" transform="translate(128 320)"/>
<use href="#thumb" transform="translate(306 320)"/>
<use href="#thumb" transform="translate(484 320)"/>
<rect x="484" y="320" width="170" height="104" rx="12" fill="#000" opacity=".55"/>
