<use href="#mk" transform="translate(130 446) scale(0.6)"/>
<text x="164" y="464" font-size="15" class="dim">Reading the logs on my computer</text>
<circle cx="404" cy="459" r="2.5" fill="#8b8b90" opacity=".9"/><circle cx="414" cy="459" r="2.5" fill="#8b8b90" opacity=".6"/><circle cx="424" cy="459" r="2.5" fill="#8b8b90" opacity=".3"/>
<g class="tag" transform="translate(440 449)"><rect width="44" height="20" rx="10"/><text x="22" y="14" text-anchor="middle">J01</text></g>

<!-- composer -->
<rect x="128" y="556" width="716" height="58" rx="29" fill="#1c1c1f" stroke="#2e2e32"/>
