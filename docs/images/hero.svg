<rect x="880" y="304" width="276" height="62" rx="14" class="card"/>
<g fill="none" stroke="#5a9cff" stroke-width="1.8"><circle cx="902" cy="326" r="3.5"/><circle cx="902" cy="344" r="3.5"/><circle cx="916" cy="344" r="3.5"/><path d="M902 329.5V340.5M916 340.5V334C916 330 913 328 909 328"/></g>
