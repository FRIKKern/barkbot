<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t d">
<title id="t">BarkBot, the three panes</title>
<desc id="d">A dark three-pane window. Left: a slim rail of bots with new chat, apps and your avatar (J02). Middle: the bot's name pill, a conversation with a working line (J01), a picture grid with a +2 tile (J08) and the composer with attach (J07). Right: the bot's mark and name, Activity and Library tabs (J03), a Coding card (J13), a Computer card that reads Working (J04) and the bot's grants.</desc>
<style>
  .page { fill: #f7f6f3; }
  @media (prefers-color-scheme: dark) { .page { fill: #0d0d0e; } }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .ink { fill: #ececea; } .dim { fill: #8b8b90; } .faint { fill: #6a6a70; }
  .pane { fill: #161617; } .edge { stroke: #2a2a2d; fill: none; }
  .bubble { fill: #1f1f22; } .mine { fill: #2d2d31; }
  .card { fill: #1c1c1f; stroke: #2c2c30; }
  .tag rect { fill: #f2a93b; } .tag text { fill: #1d1406; font-size: 11px; font-weight: 700; letter-spacing: .6px; }
</style>
<defs>
  <g id="mk">
    <path d="M26 3 C33 1 39 4 39 11 C35 9 31 9 28 10 Z" fill="#f2a93b"/>
    <path d="M20 2 A18 18 0 1 1 6.5 32.5 L2 38 L4.2 29.4 A18 18 0 0 1 20 2 Z" fill="#f4f2ee"/>
    <circle cx="14.5" cy="19" r="2.6" fill="#141414"/><circle cx="25.5" cy="19" r="2.6" fill="#141414"/>
  </g>
  <g id="mkdim">
    <path d="M26 3 C33 1 39 4 39 11 C35 9 31 9 28 10 Z" fill="#7a5a2c"/>
    <path d="M20 2 A18 18 0 1 1 6.5 32.5 L2 38 L4.2 29.4 A18 18 0 0 1 20 2 Z" fill="#6b6b70"/>
    <circle cx="14.5" cy="19" r="2.6" fill="#161617"/><circle cx="25.5" cy="19" r="2.6" fill="#161617"/>
  </g>
  <linearGradient id="shot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26262b"/><stop offset="1" stop-color="#1a1a1e"/></linearGradient>
  <g id="thumb">
    <rect width="170" height="104" rx="12" fill="url(#shot)" stroke="#303034"/>
    <rect x="14" y="14" width="64" height="8" rx="4" fill="#3a3a40"/>
    <rect x="14" y="32" width="120" height="14" rx="7" fill="#34343a"/>
    <rect x="58" y="54" width="98" height="14" rx="7" fill="#45454c"/>
    <rect x="14" y="76" width="142" height="14" rx="7" fill="#2f2f35"/>
  </g>
</defs>

<rect class="page" width="1200" height="660" rx="18"/>
<rect x="24" y="24" width="1152" height="612" rx="18" class="pane"/>
<rect x="24.5" y="24.5" width="1151" height="611" rx="17.5" class="edge"/>

<!-- window controls -->
<circle cx="52" cy="50" r="6" fill="#ff5f57"/><circle cx="72" cy="50" r="6" fill="#febc2e"/><circle cx="92" cy="50" r="6" fill="#28c840"/>

<!-- left rail -->
<path d="M108 24V636" stroke="#222225"/>
<rect x="40" y="80" width="52" height="52" rx="14" fill="#26262a"/>
<use href="#mk" transform="translate(48.5 88.5) scale(0.875)"/>
<circle cx="88" cy="128" r="7" fill="#f2a93b" stroke="#161617" stroke-width="3"/>
<use href="#mkdim" transform="translate(51 152) scale(0.75)"/>
<g class="tag" transform="translate(44 202)"><rect width="44" height="20" rx="10"/><text x="22" y="14" text-anchor="middle">J02</text></g>
<path d="M58 530H74M66 522V538" stroke="#9a9aa0" stroke-width="2" stroke-linecap="round"/>
<g fill="none" stroke="#9a9aa0" stroke-width="1.8"><rect x="57" y="560" width="7" height="7" rx="1.5"/><rect x="68" y="560" width="7" height="7" rx="1.5"/><rect x="57" y="571" width="7" height="7" rx="1.5"/><path d="M71.5 571V578M68 574.5H75"/></g>
<circle cx="66" cy="608" r="15" fill="#3b4b6e"/><circle cx="66" cy="603" r="5.5" fill="#c9d3ea"/><path d="M56 617C58 610 74 610 76 617" fill="#c9d3ea"/>
<circle cx="78" cy="619" r="4.5" fill="#3d8bfd" stroke="#161617" stroke-width="2"/>

