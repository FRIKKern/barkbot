<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="889" viewBox="0 0 1200 889" role="img" aria-labelledby="t d">
<title id="t">The oracle screen, recreated as a wireframe</title>
<desc id="d">A wireframe of the oracle's desktop window, laid out from measurements of a screenshot of 8 November 2026, with a plain circle standing in for the bot's avatar. It plays one turn in a loop: a message types into the composer and is sent, a shimmering working line reads Checking the storage while the Computer card goes from Asleep to Waking to Working, two replies arrive as shimmering bars that turn into text, a picture grid loads and shows +2, then Saving to Library shimmers and a dot lands on the Library tab.</desc>
<style>
  .page { fill: #f4f3ef; } .grid { fill: #dedcd5; }
  @media (prefers-color-scheme: dark) { .page { fill: #0a0a0b; } .grid { fill: #1c1c1e; } }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .ink { fill: #e9e9e7; } .dim { fill: #8a8a8f; } .faint { fill: #5c5c61; }
  .cap { fill: #6e6e74; font-size: 11px; font-weight: 600; letter-spacing: 1.4px; }
  .wire { fill: none; stroke: #2f2f33; } .wire2 { fill: #131315; stroke: #2f2f33; }
  .soft { fill: #19191c; stroke: #303035; }
  .hair { stroke: #232326; }
  .icon { fill: none; stroke: #9d9da3; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .bar { fill: url(#sk); }

  /* One turn, 22 s, looping, calm: soft fades, small drifts, a pause before it starts again. Base styles are the end state, so reduced motion shows a finished turn. */
  .a { animation-duration: 22s; animation-iteration-count: infinite; animation-timing-function: cubic-bezier(.4,0,.2,1); }
  .draft { opacity: 0; animation-name: draft; }
  @keyframes draft { 0% { opacity: 1 } 0.00% { opacity: 1 } 18.18% { opacity: 1 } 19.55% { opacity: 0 } 100% { opacity: 0 } }
  .ph { animation-name: ph; }
  @keyframes ph { 0% { opacity: 1 } 0.00% { opacity: 1 } 2.27% { opacity: 1 } 3.64% { opacity: 0 } 19.09% { opacity: 0 } 22.27% { opacity: 1 } 100% { opacity: 1 } }
  .user { animation-name: user; }
  @keyframes user { 0% { opacity: 0; transform: translateY(4px) } 18.18% { opacity: 0; transform: translateY(4px) } 22.27% { opacity: 1; transform: translateY(0) } 91.82% { opacity: 1; transform: translateY(0) } 97.27% { opacity: 0 } 100% { opacity: 0 } }
  .w1 { opacity: 0; animation-name: w1; }
  @keyframes w1 { 0% { opacity: 0 } 23.64% { opacity: 0 } 26.36% { opacity: 1 } 40.00% { opacity: 1 } 42.73% { opacity: 0 } 100% { opacity: 0 } }
  .asleep { opacity: 0; animation-name: asleep; }
  @keyframes asleep { 0% { opacity: 1 } 0.00% { opacity: 1 } 20.91% { opacity: 1 } 23.64% { opacity: 0 } 93.64% { opacity: 0 } 97.27% { opacity: 1 } 100% { opacity: 1 } }
  .waking { opacity: 0; animation-name: waking; }
  @keyframes waking { 0% { opacity: 0 } 20.91% { opacity: 0 } 23.64% { opacity: 1 } 30.00% { opacity: 1 } 32.73% { opacity: 0 } 100% { opacity: 0 } }
  .working { animation-name: working; }
  @keyframes working { 0% { opacity: 0 } 30.00% { opacity: 0 } 32.73% { opacity: 1 } 90.91% { opacity: 1 } 93.64% { opacity: 0 } 100% { opacity: 0 } }
  .b1 { animation-name: b1; }
  @keyframes b1 { 0% { opacity: 0; transform: translateY(4px) } 42.73% { opacity: 0; transform: translateY(4px) } 46.82% { opacity: 1; transform: translateY(0) } 91.82% { opacity: 1; transform: translateY(0) } 97.27% { opacity: 0 } 100% { opacity: 0 } }
  .s1 { opacity: 0; animation-name: s1; }
  @keyframes s1 { 0% { opacity: 1 } 0.00% { opacity: 1 } 48.18% { opacity: 1 } 50.91% { opacity: 0 } 100% { opacity: 0 } }
  .t1 { animation-name: t1; }
  @keyframes t1 { 0% { opacity: 0 } 48.18% { opacity: 0 } 50.91% { opacity: 1 } 100% { opacity: 1 } }
  .b2 { animation-name: b2; }
  @keyframes b2 { 0% { opacity: 0; transform: translateY(4px) } 51.82% { opacity: 0; transform: translateY(4px) } 55.91% { opacity: 1; transform: translateY(0) } 91.82% { opacity: 1; transform: translateY(0) } 97.27% { opacity: 0 } 100% { opacity: 0 } }
  .s2 { opacity: 0; animation-name: s2; }
  @keyframes s2 { 0% { opacity: 1 } 0.00% { opacity: 1 } 57.27% { opacity: 1 } 60.00% { opacity: 0 } 100% { opacity: 0 } }
  .t2 { animation-name: t2; }
  @keyframes t2 { 0% { opacity: 0 } 57.27% { opacity: 0 } 60.00% { opacity: 1 } 100% { opacity: 1 } }
  .g { animation-name: g; }
  @keyframes g { 0% { opacity: 0; transform: translateY(4px) } 60.91% { opacity: 0; transform: translateY(4px) } 65.00% { opacity: 1; transform: translateY(0) } 91.82% { opacity: 1; transform: translateY(0) } 97.27% { opacity: 0 } 100% { opacity: 0 } }
  .gl { opacity: 0; animation-name: gl; }
  @keyframes gl { 0% { opacity: 1 } 0.00% { opacity: 1 } 68.18% { opacity: 1 } 71.82% { opacity: 0 } 100% { opacity: 0 } }
  .gc { animation-name: gc; }
  @keyframes gc { 0% { opacity: 0 } 68.18% { opacity: 0 } 71.82% { opacity: 1 } 100% { opacity: 1 } }
  .w2 { opacity: 0; animation-name: w2; }
  @keyframes w2 { 0% { opacity: 0 } 72.73% { opacity: 0 } 75.45% { opacity: 1 } 84.55% { opacity: 1 } 87.27% { opacity: 0 } 100% { opacity: 0 } }
  .lib { animation-name: lib; }
  @keyframes lib { 0% { opacity: 0 } 85.45% { opacity: 0 } 89.09% { opacity: 1 } 91.82% { opacity: 1 } 97.27% { opacity: 0 } 100% { opacity: 0 } }
  .typer { animation-name: typer; }
  @keyframes typer { 0%, 3.64% { transform: translateX(0); animation-timing-function: steps(41, end) } 17.27%, 100% { transform: translateX(318px) } }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .45 } 50% { opacity: 1 } }
  .dot1 { animation: dot 1.8s ease-in-out infinite } .dot2 { animation: dot 1.8s ease-in-out .3s infinite } .dot3 { animation: dot 1.8s ease-in-out .6s infinite }
  @keyframes dot { 0%,100% { opacity: .2 } 45% { opacity: .75 } }
  .caret { animation: caret 1.1s ease-in-out infinite; } @keyframes caret { 0%,100% { opacity: 1 } 50% { opacity: .15 } }
  @media (prefers-reduced-motion: reduce) { .a, .pulse, .dot1, .dot2, .dot3, .caret { animation: none !important; } }
</style>
