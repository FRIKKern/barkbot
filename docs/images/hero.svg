<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="892" viewBox="0 0 1200 892" role="img" aria-labelledby="t d">
<title id="t">The oracle screen, recreated</title>
<desc id="d">A recreation of the oracle's desktop window, measured from a screenshot of 8 November 2026, with a plain stand-in avatar. Left rail: window controls, the bot's tile with a badge, then new chat, apps and the owner's avatar at the bottom. Middle: sidebar button, the bot's name pill, Share, a file card, the time, a request bubble, three reply bubbles and a picture grid with +2, then the composer. Right panel: close, the avatar and name, Activity and Library tabs, and the Coding, Suggested, Computer and Voice chat cards.</desc>
<style>
  .page { fill: #f7f6f3; }
  @media (prefers-color-scheme: dark) { .page { fill: #0d0d0e; } }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .ink { fill: #ececec; } .dim { fill: #8e8e8e; } .faint { fill: #6f6f6f; }
  .bot { fill: #212121; stroke: #2b2b2b; } .me { fill: #383838; }
  .card { fill: #1d1d1d; stroke: #2a2a2a; }
  .line { stroke: #262626; }
  .icon { fill: none; stroke: #b9b9b9; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
</style>
