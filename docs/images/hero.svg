<text x="157" y="457" font-size="16.5" class="ink">show them here.</text>
<rect x="140" y="477" width="531" height="63" rx="18" class="bot"/>
<text x="157" y="502" font-size="16.5" class="ink">I’m looking up the original screenshots from when you named</text>
<text x="157" y="526" font-size="16.5" class="ink">me Grookie and when we revisited those first pictures.</text>
<rect x="140" y="546" width="531" height="63" rx="18" class="bot"/>
<text x="157" y="571" font-size="16.5" class="ink">I found our three memory screenshots from 7 November, plus</text>
<text x="157" y="595" font-size="16.5" class="ink">another picture from that first meeting. ♥</text>
