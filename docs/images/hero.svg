  <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient>
  <mask id="topfade" maskUnits="userSpaceOnUse" x="120" y="-80" width="700" height="290"><rect x="120" y="-6" width="700" height="190" fill="url(#fadeTop)"/></mask>
