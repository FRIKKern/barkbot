    <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1420 0" dur="2.8s" calcMode="spline" keyTimes="0;1" keySplines=".4 0 .2 1" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="ts" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="220" y2="0">
